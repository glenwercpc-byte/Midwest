<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>중서부 한미노회 · 정기노회 회의안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#1E2A44;
  --ink-soft:#3B4A6B;
  --paper:#F6F1E7;
  --paper-deep:#EFE7D6;
  --edge:#D9CFBB;
  --gold:#A9822C;
  --gold-soft:#DFC98C;
  --maroon:#7A2E2E;
  --maroon-soft:#F1DCDA;
  --navy-soft:#DDE3EF;
  --sub:#6b6a5e;
  --white:#FFFDF8;
  --shadow: 0 1px 2px rgba(30,42,68,.06), 0 8px 24px rgba(30,42,68,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background: linear-gradient(180deg,#EAE3D2 0%, #E3D9C4 100%);
  color:var(--ink);
  min-height:100vh;
}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ---------- Toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  background:var(--ink);
  color:var(--white);
  flex-wrap:wrap;
}
.toolbar .brand{
  font-family:'Noto Serif KR',serif;
  font-weight:600;font-size:15px;
  letter-spacing:.02em;
  margin-right:auto;
  white-space:nowrap;
}
.toolbar .brand small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:11px;color:#B9C2D6;}
.tbtn{
  appearance:none;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);color:var(--white);
  padding:8px 12px;border-radius:7px;font-size:13px;font-weight:500;
  cursor:pointer;transition:background .15s ease;white-space:nowrap;
  font-family:'Noto Sans KR',sans-serif;
}
.tbtn:hover{background:rgba(255,255,255,.16);}
.tbtn.primary{background:var(--gold);border-color:var(--gold);color:#241C08;font-weight:700;}
.tbtn.primary:hover{background:#BC943A;}
.tbtn.mode-locked{background:var(--maroon-soft);color:var(--maroon);border-color:var(--maroon-soft);}
.tbtn.mode-edit{background:var(--gold-soft);color:#4a3a05;border-color:var(--gold-soft);}
.savebadge{font-size:12px;color:#B9C2D6;white-space:nowrap;}

/* ---------- Workspace ---------- */
.workspace{display:flex;flex:1;min-height:0;}
#tocPanel{
  width:270px;flex:0 0 270px;
  background:var(--paper-deep);
  border-right:1px solid var(--edge);
  padding:18px 14px 40px;
  overflow-y:auto;
  max-height:calc(100vh - 54px);
  position:sticky;top:54px;align-self:flex-start;
}
#tocPanel h3{
  font-family:'Noto Serif KR',serif;font-size:13px;color:var(--sub);
  margin:0 0 10px 4px;font-weight:600;letter-spacing:.03em;
}
#tocPanel .toc-row, #tocPanel .toc-subrow{
  display:block;width:100%;text-align:left;cursor:pointer;
  padding:7px 8px;border-radius:6px;
  font-family:'Noto Serif KR',serif;font-size:13.5px;color:var(--ink-soft);
  line-height:1.4;transition:background .12s ease,color .12s ease;
}
#tocPanel .toc-row:hover, #tocPanel .toc-subrow:hover{
  background:var(--navy-soft);color:var(--ink);font-weight:700;
}
#tocPanel .toc-row .n{color:var(--gold);font-weight:700;margin-right:6px;}
#tocPanel .toc-subrow{padding-left:20px;font-size:12.5px;color:var(--sub);}
#tocPanel .toc-subrow:hover{color:var(--ink);}

#docPanel{flex:1;min-width:0;padding:32px 20px 120px;display:flex;flex-direction:column;align-items:center;}

/* ---------- Paper / document ---------- */
.page{
  width:100%;max-width:760px;
  background:var(--paper);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
  padding:46px 52px;
  margin-bottom:26px;
  border-radius:2px;
  position:relative;
}
.page::before{
  content:"";position:absolute;inset:10px;
  border:1px solid var(--edge);pointer-events:none;opacity:.55;
}
.cover{text-align:center;}
.emblem{margin:6px auto 18px;width:168px;height:168px;object-fit:contain;display:block;}
.cover h1{
  font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:26px;line-height:1.45;margin:4px 0 2px;color:var(--ink);
}
.cover .ordinal-field{
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:26px;
  color:var(--maroon);
}
.cover .en-title{
  font-size:14px;color:var(--sub);margin:14px 0 26px;line-height:1.7;
}
.cover .rule{width:64px;height:2px;background:var(--gold);margin:22px auto;}
.cover .dt{font-family:'Noto Serif KR',serif;font-size:17px;margin:20px 0 2px;}
.cover .venue-card{
  margin:34px auto 0;padding:18px 22px;border:1px solid var(--edge);
  background:var(--white);border-radius:6px;max-width:420px;
}
.cover .venue-card .host{font-family:'Noto Serif KR',serif;font-weight:600;font-size:17px;color:var(--maroon);}
.cover .venue-card .pastor{font-size:13.5px;color:var(--ink-soft);margin-top:6px;}
.cover .venue-card .addr{font-size:12.5px;color:var(--sub);margin-top:2px;}

.doc-header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px;}
.doc-header .org{font-size:11.5px;color:var(--sub);text-align:center;letter-spacing:.03em;}
.doc-header h2{
  font-family:'Noto Serif KR',serif;font-size:19px;text-align:center;
  margin:10px 0 14px;color:var(--ink);
}
.meta-row{display:flex;gap:24px;justify-content:center;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
.meta-row b{color:var(--ink);}

.roman-block{margin:20px 0 26px;}
.roman-block h4{
  font-family:'Noto Serif KR',serif;font-size:14.5px;color:var(--maroon);
  margin:0 0 8px;display:flex;align-items:center;gap:8px;
}
.roman-block h4 .chair{font-size:12px;color:var(--sub);font-weight:400;font-family:'Noto Sans KR',sans-serif;}
.role-grid{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;font-size:13px;}
.role-grid .k{color:var(--sub);}
.role-grid input{
  border:none;border-bottom:1px dotted var(--edge);background:transparent;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--ink);
  padding:2px 2px;width:100%;
}
.role-grid input:disabled{color:var(--ink);opacity:1;}
.role-grid input:focus{outline:none;border-bottom:1px solid var(--gold);}

/* section blocks (items 1-12) */
.section-block{margin:0 0 30px;scroll-margin-top:70px;}
.section-block .sec-title{
  display:flex;align-items:baseline;gap:10px;
  font-family:'Noto Serif KR',serif;font-size:15.5px;font-weight:600;
  color:var(--ink);border-bottom:1px solid var(--edge);padding-bottom:8px;margin-bottom:12px;
}
.section-block .sec-title .num{
  color:var(--white);background:var(--ink);border-radius:5px;
  width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;flex:0 0 auto;
}
.section-block .sec-title input.title-edit{
  font-family:'Noto Serif KR',serif;font-weight:600;font-size:15.5px;
  border:none;background:transparent;flex:1;color:var(--ink);
}
.section-block .sec-title input.title-edit:focus{outline:none;border-bottom:1px solid var(--gold);}

.sub-block{margin:0 0 18px;padding-left:2px;scroll-margin-top:70px;}
.sub-block .sub-label{
  display:flex;align-items:center;gap:8px;
  font-family:'Noto Serif KR',serif;font-size:13.5px;font-weight:700;color:var(--ink);
  margin-bottom:6px;
}
.sub-block .sub-label input{
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:13.5px;color:var(--ink);
  border:none;background:transparent;flex:1;
}
.sub-block .sub-label input:focus{outline:none;border-bottom:1px solid var(--gold);}
.sub-block .subdel{
  background:none;border:none;color:var(--sub);cursor:pointer;font-size:12px;
}

.line{
  display:flex;align-items:flex-start;gap:8px;margin:6px 0;
  padding:5px 8px;border-radius:5px;
}
.line:hover{background:rgba(169,130,44,.06);}
.line .line-num{color:var(--gold);font-size:12px;font-weight:700;margin-top:8px;flex:0 0 16px;}
.line .line-text{
  flex:1;border:none;border-bottom:1px solid transparent;background:transparent;
  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:var(--ink);
  padding:6px 2px;line-height:1.5;resize:none;min-height:32px;overflow:hidden;
}
.line .line-text:focus{outline:none;border-bottom:1px solid var(--gold);}
.line .tag-pill{
  flex:0 0 auto;font-size:11px;font-weight:700;border:none;border-radius:11px;
  padding:5px 9px;margin-top:2px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
}
.tag-report{background:var(--navy-soft);color:var(--ink-soft);}
.tag-motion{background:var(--maroon-soft);color:var(--maroon);}
.tag-none{background:transparent;color:var(--sub);border:1px dashed var(--edge)!important;}
.line .attach-chip{
  flex:0 0 auto;font-size:11.5px;font-weight:600;border:1px solid var(--gold);
  background:var(--gold-soft);color:#4a3a05;border-radius:11px;padding:5px 10px;
  cursor:pointer;white-space:nowrap;margin-top:2px;
}
.line .line-del{
  flex:0 0 auto;background:none;border:none;color:#b04a4a;cursor:pointer;
  font-size:14px;padding:4px;margin-top:3px;
}
.addline-btn, .addsub-btn{
  background:none;border:1px dashed var(--edge);color:var(--sub);
  font-size:12.5px;padding:7px 12px;border-radius:6px;cursor:pointer;margin-top:4px;
  font-family:'Noto Sans KR',sans-serif;
}
.addline-btn:hover, .addsub-btn:hover{border-color:var(--gold);color:var(--gold);}

/* TOC-in-document (item 4) */
.toc-render{border:1px solid var(--edge);background:var(--white);border-radius:6px;overflow:hidden;}
.toc-render .toc-row{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--edge);cursor:pointer;font-size:13.5px;
  font-family:'Noto Serif KR',serif;color:var(--ink);
}
.toc-render .toc-row:last-child{border-bottom:none;}
.toc-render .toc-row:hover{background:var(--paper-deep);}
.toc-render .toc-row .n{
  width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--white);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;
}
.toc-render .toc-subrow{
  padding:6px 14px 6px 44px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
  font-weight:700;border-bottom:1px dashed var(--edge);
}
.toc-render .toc-subrow:hover{background:var(--paper-deep);color:var(--ink);}
.toc-render .toc-row-edit, .toc-render .toc-subrow-edit{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-bottom:1px dashed var(--edge);
}
.toc-render .toc-subrow-edit{padding-left:44px;}
.toc-render .toc-row-edit:last-child{border-bottom:none;}
.toc-render .toc-row-edit .n{cursor:pointer;}
.toc-render .toc-subrow-edit .sub-jump{
  width:22px;flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--gold);cursor:pointer;
}
.toc-edit-input{
  flex:1;border:none;border-bottom:1px dotted var(--edge);background:transparent;
  font-family:'Noto Serif KR',serif;font-size:13px;color:var(--ink);padding:4px 2px;
}
.toc-edit-input:focus{outline:none;border-bottom:1px solid var(--gold);}

.next-grid{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:13.5px;max-width:480px;}
.next-grid .k{color:var(--sub);}
.next-grid input{border:none;border-bottom:1px dotted var(--edge);background:transparent;font-size:13.5px;padding:3px 2px;width:100%;font-family:'Noto Sans KR',sans-serif;}
.next-grid input:focus{outline:none;border-bottom:1px solid var(--gold);}

.footer-note{text-align:center;color:var(--sub);font-size:11.5px;margin-top:6px;}

/* ---------- Modal ---------- */
#modalOverlay,#newOrgOverlay{
  position:fixed;inset:0;background:rgba(20,20,15,.5);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
#modalOverlay.hidden,#newOrgOverlay.hidden{display:none;}
#newOrgOverlay{z-index:130;}
.dlg-note{font-size:12px;color:var(--sub);line-height:1.6;margin:0 0 14px;white-space:normal;}
.dlg-input{width:100%;padding:8px 10px;border:1px solid var(--edge);border-radius:6px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;}
.dlg-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.dlg-actions button{
  padding:10px;border-radius:7px;border:1px solid var(--gold);background:var(--gold-soft);
  color:#4a3a05;font-weight:700;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
}
.dlg-actions button:hover{background:var(--gold);color:#241C08;}
.modal-box{
  background:var(--white);max-width:560px;width:100%;max-height:80vh;overflow-y:auto;
  border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--edge);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--edge);background:var(--paper-deep);
  border-radius:8px 8px 0 0;
}
.modal-head h3{font-family:'Noto Serif KR',serif;font-size:15px;margin:0;color:var(--ink);}
.modal-close{
  background:var(--ink);color:var(--white);border:none;border-radius:50%;
  width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;
}
.modal-body{padding:18px 20px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;color:var(--ink-soft);}

/* 규례서 드롭다운 메뉴 */
.boo-dropdown{position:relative;}
.boo-menu{
  position:absolute;top:calc(100% + 6px);left:0;
  background:var(--white);border:1px solid var(--edge);border-radius:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);padding:6px;min-width:200px;z-index:110;
  display:flex;flex-direction:column;gap:4px;
}
.boo-menu.hidden{display:none;}
.boo-menu button{
  background:none;border:none;text-align:left;padding:9px 10px;border-radius:6px;
  font-size:13px;color:var(--ink);cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  white-space:nowrap;
}
.boo-menu button:hover{background:var(--paper-deep);}
.modal-body textarea{
  width:100%;min-height:160px;border:1px solid var(--edge);border-radius:6px;padding:10px;

  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.6;
}

/* ---------- Archive panel ---------- */
#archiveOverlay{position:fixed;inset:0;background:rgba(20,20,15,.5);display:flex;justify-content:flex-end;z-index:90;}
#archiveOverlay.hidden{display:none;}
.archive-panel{width:100%;max-width:420px;background:var(--paper);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);}
.archive-head{padding:18px 20px;border-bottom:1px solid var(--edge);background:var(--ink);color:var(--white);display:flex;justify-content:space-between;align-items:center;}
.archive-head h3{font-family:'Noto Serif KR',serif;margin:0;font-size:16px;}
.archive-body{padding:16px 20px;}
.archive-search{width:100%;padding:10px 12px;border:1px solid var(--edge);border-radius:7px;font-size:13.5px;margin-bottom:6px;font-family:'Noto Sans KR',sans-serif;}
.search-hint{font-size:11.5px;color:var(--sub);line-height:1.5;margin-bottom:14px;}
.archive-item{
  background:var(--white);border:1px solid var(--edge);border-radius:7px;padding:12px 14px;
  margin-bottom:10px;cursor:pointer;
}
.archive-item:hover{border-color:var(--gold);}
.archive-item .t{font-family:'Noto Serif KR',serif;font-weight:600;color:var(--ink);font-size:14px;}
.archive-item .d{font-size:12px;color:var(--sub);margin-top:3px;}
.archive-empty{color:var(--sub);font-size:13px;text-align:center;margin-top:30px;}

/* ---------- 위원회 조직 패널 ---------- */
#orgOverlay{
  position:fixed;inset:0;background:rgba(20,20,15,.5);
  display:flex;align-items:flex-start;justify-content:center;z-index:120;
  padding:24px 16px;overflow-y:auto;
}
#orgOverlay.hidden{display:none;}
.org-panel{
  background:var(--white);max-width:1280px;width:92vw;
  border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--edge);
  margin-bottom:40px;
}
.org-head{
  position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--edge);background:var(--paper-deep);
  border-radius:8px 8px 0 0;z-index:2;
}
.org-head h3{font-family:'Noto Serif KR',serif;font-size:16px;margin:0;color:var(--ink);}
.org-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.org-head-actions .savebadge{color:var(--ink-soft)!important;font-weight:600;font-size:12px;}
.org-head-actions .tbtn{
  background:var(--ink);color:var(--white);border:1px solid var(--ink);font-weight:600;
}
.org-head-actions .tbtn:hover{background:var(--ink-soft);border-color:var(--ink-soft);}
.org-body{padding:18px 20px 30px;}

.org-exec-grid{display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:10px;}
.org-exec-chip{
  background:var(--paper);border:1px solid var(--edge);border-radius:7px;padding:6px 8px;
  display:flex;align-items:center;gap:4px;flex:1 1 0;min-width:0;
}
.org-exec-chip .lbl{font-size:10.5px;font-weight:700;color:var(--maroon);white-space:nowrap;flex:0 0 auto;}
.org-exec-chip input{border:none;border-bottom:1px dotted var(--edge);background:transparent;font-size:11.5px;padding:2px;font-family:'Noto Sans KR',sans-serif;flex:1;min-width:0;}
.org-exec-chip input:focus{outline:none;border-bottom:1px solid var(--gold);}
.org-exec-wide{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.org-exec-wide-row{
  display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;
  background:var(--paper);border:1px solid var(--edge);border-radius:7px;padding:8px 10px;
}
.org-exec-wide-row .lbl{font-size:12px;font-weight:700;color:var(--maroon);}
.org-exec-wide-row input{border:none;border-bottom:1px dotted var(--edge);background:transparent;font-size:12.5px;padding:2px;font-family:'Noto Sans KR',sans-serif;width:100%;}
.org-exec-wide-row input:focus{outline:none;border-bottom:1px solid var(--gold);}

.org-table-wrap{overflow-x:auto;}
.org-table{width:100%;border-collapse:collapse;font-size:12px;min-width:1020px;table-layout:fixed;}
.org-table th,.org-table td{border:1px solid var(--edge);padding:4px 5px;vertical-align:top;}
.org-table th{background:var(--paper-deep);font-family:'Noto Serif KR',serif;font-weight:700;}
.org-table th:first-child,.org-table td:first-child{width:130px;}
.org-table th input{width:100%;text-align:center;font-weight:700;border:none;background:transparent;border-bottom:1px dotted var(--edge);font-family:'Noto Serif KR',serif;padding:3px;}
.org-committee-name{font-weight:700;text-align:center;white-space:nowrap;font-family:'Noto Serif KR',serif;vertical-align:middle!important;}
.org-table tbody tr:nth-child(odd) td{background:#F3ECDA;}
.org-table tbody tr:nth-child(even) td{background:#FFFFFF;}
.org-table tbody tr:nth-child(odd) td.org-committee-name{background:#E6D9B8;}
.org-table tbody tr:nth-child(even) td.org-committee-name{background:#EFE9D8;}
.org-cell{display:grid;grid-template-columns:1fr 1fr;gap:1px;min-width:260px;}
.org-cell-6{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;}
.org-sublist{display:flex;flex-direction:column;gap:0;}
.org-person-row{display:flex;align-items:center;gap:1px;}
.org-person-row input{
  flex:0 0 85%;width:85%;border:1px solid transparent;background:transparent;
  border-radius:4px;padding:2px 4px;font-size:12px;font-family:'Noto Sans KR',sans-serif;min-width:0;
}
.org-person-row input:focus{outline:none;border-color:var(--gold);background:#fff;}
.org-person-row input:hover{background:var(--paper);}
.org-person-del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:12px;padding:1px 3px;flex:0 0 auto;}
.org-person-del.org-hide{visibility:hidden;}
.org-person-del:hover{color:var(--maroon);}
.org-person-add{
  background:none;border:1px dashed var(--edge);border-radius:5px;font-size:11px;color:var(--sub);
  padding:3px 6px;cursor:pointer;margin-top:2px;font-family:'Noto Sans KR',sans-serif;
}
.org-person-add:hover{border-color:var(--gold);color:var(--gold);}

.org-print-view{display:none;font-family:'Noto Sans KR',sans-serif;color:#111;}

/* ============================= 전역 상태 ============================= */
var state = { meeting: seedMeeting105() };
var editMode = false;
var currentAnchor = 'cover';
var io = null;
var dirty = false;

function getPath(obj, path){
  var o = obj;
  for(var i=0;i<path.length;i++){ if(o==null) return o; o = o[path[i]]; }
  return o;
}
function esc(s){
  return (s==null?'':String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** "교육 및 목사후보생 (CPM)" 처럼 끝에 괄호 약칭이 붙은 위원회명을
    "교육 및 목사후보생<br>(CPM)" 형태로, 약칭을 아래 줄에 표시합니다. */
function formatCommitteeName(name){
  var m = (name||'').match(/^(.*?)\s*(\([^)]*\))\s*$/);
  if(m && m[1]){ return esc(m[1]) + '<br>' + esc(m[2]); }
  return esc(name);
}

function markDirty(){ dirty=true; var b=document.getElementById('saveBadge'); b.textContent='저장 안 된 변경사항 있음'; b.style.color='#e2b04a'; }
function markClean(){ dirty=false; var b=document.getElementById('saveBadge'); b.textContent='저장됨'; b.style.color='#B9C2D6'; }

function setField(path, value){
  var parent = getPath(state, path.slice(0,-1));
  if(parent==null) return;
  parent[path[path.length-1]] = value;
  markDirty();
  updateBrand();
}
function addLine(path){
  var arr = getPath(state, path);
  arr.push({text:'',tag:'',hasAttachment:false,attachmentContent:''});
  markDirty(); render();
}
function removeLine(path, idx){
  var arr = getPath(state, path);
  arr.splice(idx,1);
  markDirty(); render();
}
function cycleTag(path, idx){
  var arr = getPath(state, path);
  var order = ['', 'report', 'motion'];
  var cur = order.indexOf(arr[idx].tag||'');
  arr[idx].tag = order[(cur+1)%order.length];
  markDirty(); render();
}
function toggleAttach(path, idx){
  var arr = getPath(state, path);
  arr[idx].hasAttachment = !arr[idx].hasAttachment;
  markDirty(); render();
}
function addSub(sKey){
  var subs = state.meeting.sections[sKey].subs;
  var letter = String.fromCharCode(65+subs.length);
  subs.push({key:letter,label:'새 위원회 / 보고 항목',lines:[]});
  markDirty(); render();
}
function removeSub(sKey, idx){
  state.meeting.sections[sKey].subs.splice(idx,1);
  markDirty(); render();
}
function onSubLabelInput(el, k, i){
  var v = el.value;
  var dotIdx = v.indexOf('.');
  var sub = state.meeting.sections[k].subs[i];
  if(dotIdx>0){ sub.key = v.slice(0,dotIdx).trim(); sub.label = v.slice(dotIdx+1).trim(); }
  else { sub.label = v; }
  markDirty();
}

/* ============================= 렌더링 ============================= */
function tagLabel(tag){ return tag==='report' ? '보고' : tag==='motion' ? '동의안' : '구분'; }
function tagClass(tag){ return tag==='report' ? 'tag-report' : tag==='motion' ? 'tag-motion' : 'tag-none'; }

function fieldAttr(path){ return ' data-path="'+esc(JSON.stringify(path))+'"'; }

function renderLineRow(pathArr, line, idx){
  var pathA = fieldAttr(pathArr);
  var disabledAttr = editMode ? '' : ' disabled';
  var out = '';
  out += '<div class="line">';
  out += '<span class="line-num">'+(idx+1)+'.</span>';
  out += '<textarea class="line-text js-line-text"'+pathA+' data-idx="'+idx+'" rows="1"'+disabledAttr+' placeholder="내용을 입력하세요">'+esc(line.text)+'</textarea>';
  if(editMode){
    out += '<button type="button" class="tag-pill '+tagClass(line.tag)+' js-cycle-tag"'+pathA+' data-idx="'+idx+'">'+tagLabel(line.tag)+'</button>';
  } else if(line.tag){
    out += '<span class="tag-pill '+tagClass(line.tag)+'">'+tagLabel(line.tag)+'</span>';
  }
  if(editMode){
    var attachCls = line.hasAttachment ? 'tag-pill js-toggle-attach attach-on' : 'tag-pill js-toggle-attach';
    out += '<button type="button" class="'+attachCls+'"'+pathA+' data-idx="'+idx+'">📎 첨부</button>';
  } else if(line.hasAttachment){
    out += '<button type="button" class="attach-chip js-open-attachment"'+pathA+' data-idx="'+idx+'">📎 첨부서류 참고</button>';
  }
  if(editMode){
    out += '<button type="button" class="line-del js-remove-line"'+pathA+' data-idx="'+idx+'" title="삭제">✕</button>';
  }
  out += '</div>';
  if(editMode && line.hasAttachment){
    out += '<textarea class="attach-note js-attach-content"'+pathA+' data-idx="'+idx+'" placeholder="첨부 내용 메모 (예: 파일명, 요약, 링크)">'+esc(line.attachmentContent)+'</textarea>';
  }
  return out;
}

function renderLinesBlock(pathArr, lines){
  var out = '';
  lines.forEach(function(line, idx){ out += renderLineRow(pathArr, line, idx); });
  if(editMode){
    out += '<button type="button" class="addline-btn js-add-line"'+fieldAttr(pathArr)+'>+ 항목 추가</button>';
  }
  if(!editMode && lines.length===0){
    out += '<div style="color:var(--sub);font-size:13px;">— 내용 없음 —</div>';
  }
  return out;
}

function tocRows(editable){
  var s = state.meeting.sections;
  var order = ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12'];
  var out = '';
  order.forEach(function(k){
    var sec = s[k];
    if(editable){
      out += '<div class="toc-row-edit"><span class="n js-goto" data-skey="'+k+'">'+sec.num+'</span><input class="toc-edit-input js-field"'+fieldAttr(['meeting','sections',k,'title'])+' value="'+esc(sec.title)+'"></div>';
    } else {
      out += '<div class="toc-row js-goto" data-skey="'+k+'"><span class="n">'+sec.num+'</span><span>'+esc(sec.title)+'</span></div>';
    }
    if(sec.kind==='sub'){
      sec.subs.forEach(function(sub, i){
        if(editable){
          out += '<div class="toc-subrow-edit"><span class="sub-jump js-goto" data-skey="'+k+'" data-subidx="'+i+'">'+esc(sub.key)+'.</span><input class="toc-edit-input js-field"'+fieldAttr(['meeting','sections',k,'subs',i,'label'])+' value="'+esc(sub.label)+'"></div>';
        } else {
          out += '<div class="toc-subrow js-goto" data-skey="'+k+'" data-subidx="'+i+'">'+esc(sub.key)+'. '+esc(sub.label)+'</div>';
        }
      });
    }
  });
  return out;
}

function renderSectionTitle(k, sec){
  var disabledAttr = editMode ? '' : ' disabled';
  if(editMode){
    return '<div class="sec-title"><span class="num">'+sec.num+'</span><input class="title-edit js-field"'+fieldAttr(['meeting','sections',k,'title'])+disabledAttr+' value="'+esc(sec.title)+'"></div>';
  }
  return '<div class="sec-title"><span class="num">'+sec.num+'</span><span>'+esc(sec.title)+'</span></div>';
}

function renderSection(k){
  var sec = state.meeting.sections[k];
  var out = '<div class="section-block" id="sec-'+k+'" data-anchor="'+k+'">';
  out += renderSectionTitle(k, sec);

  if(sec.kind==='static'){
    if(k==='s1'){
      out += '<div style="font-size:13px;color:var(--sub);">사회: '+esc(state.meeting.meetingChair||'—')+'</div>';
    } else if(k==='s12'){
      out += '<div style="font-size:13px;color:var(--sub);">제 '+esc(state.meeting.ordinal||'—')+'차 정기노회를 폐회합니다.</div>';
    }
  } else if(sec.kind==='lines'){
    out += renderLinesBlock(['meeting','sections',k,'lines'], sec.lines);
  } else if(sec.kind==='sub'){
    sec.subs.forEach(function(sub, i){
      var disabledAttr = editMode ? '' : ' disabled';
      out += '<div class="sub-block" id="sec-'+k+'-sub-'+i+'" data-anchor="'+k+'-sub-'+i+'">';
      out += '<div class="sub-label">';
      if(editMode){
        out += '<input class="js-sub-label" data-skey="'+k+'" data-subidx="'+i+'" value="'+esc(sub.key+'. '+sub.label)+'">';
        out += '<button type="button" class="subdel js-remove-sub" data-skey="'+k+'" data-subidx="'+i+'">삭제</button>';
      } else {
        out += '<span>'+esc(sub.key)+'. '+esc(sub.label)+'</span>';
      }
      out += '</div>';
      out += renderLinesBlock(['meeting','sections',k,'subs',i,'lines'], sub.lines);
      out += '</div>';
    });
    if(editMode){
      out += '<button type="button" class="addsub-btn js-add-sub" data-skey="'+k+'">+ 위원회 / 보고 항목 추가</button>';
    }
  } else if(sec.kind==='toc'){
    out += '<div class="toc-render">'+tocRows(editMode)+'</div>';
    if(editMode){
      out += '<div style="margin-top:8px;font-size:12px;color:var(--sub);">각 항목의 제목을 바로 수정할 수 있습니다. 번호나 글자를 누르면 해당 위치로 이동합니다.</div>';
    }
  } else if(sec.kind==='next'){
    var d = sec.data;
    out += '<div class="next-grid">';
    out += '<div class="k">다음 회차</div><div>제 '+inputSpan(['meeting','sections','s9','data','ordinal'], d.ordinal)+'</div>';
    out += '<div class="k">일시</div><div>'+inputSpan(['meeting','sections','s9','data','dateDisplay'], d.dateDisplay)+'</div>';
    out += '<div class="k">장소</div><div>'+inputSpan(['meeting','sections','s9','data','venue'], d.venue)+'</div>';
    out += '<div class="k">주소</div><div>'+inputSpan(['meeting','sections','s9','data','address'], d.address)+'</div>';
    out += '</div>';
  }
  out += '</div>';
  return out;
}

function inputSpan(pathArr, val){
  var disabledAttr = editMode ? '' : ' disabled';
  if(editMode){
    return '<input class="js-field"'+fieldAttr(pathArr)+disabledAttr+' value="'+esc(val)+'">';
  }
  return esc(val||'—');
}

function roleField(labelKo, pathArr, val){
  if(editMode){
    return '<div class="k">'+labelKo+'</div><div><input class="js-field"'+fieldAttr(pathArr)+' value="'+esc(val)+'"></div>';
  }
  return '<div class="k">'+labelKo+'</div><div>'+esc(val||'—')+'</div>';
}

function renderCover(){

function render(){
  updateBrand();
  var out = renderCover() + renderPage2Header();
  out += '<div class="page">';
  ['s5','s6','s7','s8'].forEach(function(k){ out += renderSection(k); });
  out += '<div class="page-num">3 / 4</div>';
  out += '</div>';
  out += '<div class="page">';
  ['s9','s10','s11','s12'].forEach(function(k){ out += renderSection(k); });
  out += '<div class="footer-note">중서부 한미노회 · Midwest Korean American Presbytery</div>';
  out += '<div class="page-num">4 / 4</div>';
  out += '</div>';

  document.getElementById('docPanel').innerHTML = out;
  document.getElementById('tocList').innerHTML = tocRows();
  document.querySelectorAll('.line-text[data-idx], .js-attach-content').forEach(autoGrow);
  setupObserver();
  updateModeUI();
}

function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }
function updateBrand(){ document.getElementById('brandSub').textContent = '제 '+(state.meeting.ordinal||'—')+' 차 정기노회'; }

/* ============================= 네비게이션 (회순 이동 + 뒤로가기) ============================= */
function scrollToAnchor(anchor){
  var el = document.getElementById(anchor==='cover' ? 'page-cover' : anchor==='header' ? 'page-header' : 'sec-'+anchor);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function gotoSection(k, subIdx){
  var target = (subIdx!==undefined && subIdx!==null && subIdx!=='') ? (k+'-sub-'+subIdx) : k;
  scrollToAnchor(target);
  currentAnchor = target;
  closeTocPanelMobile();
}
function setupObserver(){
  if(io) io.disconnect();
  var blocks = document.querySelectorAll('[data-anchor]');
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ currentAnchor = en.target.getAttribute('data-anchor'); } });
  }, {root:document.getElementById('docPanel'), threshold:0.2, rootMargin:'-40% 0px -50% 0px'});
  blocks.forEach(function(b){ io.observe(b); });
}

/* ============================= 첨부서류 팝업 ============================= */
function openAttachment(pathArr, idx){
  var arr = getPath(state, pathArr);
  var line = arr[idx];
  document.getElementById('modalTitle').textContent = '📎 첨부서류 — ' + (line.text||'').slice(0,40);
  document.getElementById('modalBody').textContent = line.attachmentContent || '(첨부 내용이 아직 입력되지 않았습니다. 편집모드에서 추가해 주세요.)';
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalOverlay').classList.add('hidden'); }

/* ---------- 규례서 (PC(USA) Book of Order) 찾아보기 ----------
   저작권이 있는 규례서 원문을 이 앱 안에 담지 않고, 미국장로교(PC(USA))
   공식 사이트의 최신판(2025-2027) PDF를 새 탭으로 열어서 찾아보게 합니다. */
var BOO_URL_KO = 'https://pcusa.org/sites/default/files/2026-08/Book_of_Order_2025-27_KO.pdf';
var BOO_URL_EN = 'https://pcusa.org/sites/default/files/2025-08/2025_0724_Book_of_Order_Interactive_2025-2027.pdf';

}

function openBookOfOrderPdf(lang){
  var base = (lang==='en') ? BOO_URL_EN : BOO_URL_KO;
  window.open(base + '#zoom=200', '_blank', 'noopener');
  closeBooMenu();
}
document.addEventListener('click', function(e){

/* ============================= 편집모드 토글 ============================= */
function toggleEditMode(){ editMode=!editMode; render(); }

function toggleTocPanel(){ document.getElementById('tocPanel').classList.toggle('open'); }

/* ============================= 이벤트 위임 (클릭 / 입력) ============================= */
function onWorkspaceClick(e){
  var el = e.target.closest('.js-cycle-tag,.js-toggle-attach,.js-open-attachment,.js-remove-line,.js-add-line,.js-remove-sub,.js-add-sub,.js-goto,.js-load-meeting');
  if(!el) return;
  var path = el.dataset.path ? JSON.parse(el.dataset.path) : null;
  var idx = el.dataset.idx!==undefined ? parseInt(el.dataset.idx,10) : undefined;
  if(el.classList.contains('js-cycle-tag')) cycleTag(path, idx);
  else if(el.classList.contains('js-toggle-attach')) toggleAttach(path, idx);
  else if(el.classList.contains('js-open-attachment')) openAttachment(path, idx);
  else if(el.classList.contains('js-remove-line')) removeLine(path, idx);
  else if(el.classList.contains('js-add-line')) addLine(path);
  else if(el.classList.contains('js-remove-sub')) removeSub(el.dataset.skey, parseInt(el.dataset.subidx,10));
  else if(el.classList.contains('js-add-sub')) addSub(el.dataset.skey);
  else if(el.classList.contains('js-goto')) gotoSection(el.dataset.skey, el.dataset.subidx);
  else if(el.classList.contains('js-load-meeting')) loadMeeting(el.dataset.id);
}
function onWorkspaceInput(e){
  var el = e.target;
  if(el.classList.contains('js-line-text')){
    var path = JSON.parse(el.dataset.path).concat([parseInt(el.dataset.idx,10),'text']);
    setField(path, el.value); autoGrow(el);
  } else if(el.classList.contains('js-attach-content')){
    var path2 = JSON.parse(el.dataset.path).concat([parseInt(el.dataset.idx,10),'attachmentContent']);
    setField(path2, el.value); autoGrow(el);
  } else if(el.classList.contains('js-field')){
    setField(JSON.parse(el.dataset.path), el.value);
  } else if(el.classList.contains('js-sub-label')){
    onSubLabelInput(el, el.dataset.skey, parseInt(el.dataset.subidx,10));
  }
}
document.getElementById('docPanel').addEventListener('click', onWorkspaceClick);
document.getElementById('docPanel').addEventListener('input', onWorkspaceInput);
document.getElementById('tocList').addEventListener('click', onWorkspaceClick);
document.getElementById('archiveList').addEventListener('click', onWorkspaceClick);
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });
document.getElementById('archiveOverlay').addEventListener('click', function(e){ if(e.target.id==='archiveOverlay') closeArchive(); });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    closeModal(); closeArchive(); closeBooMenu();
    var newOrgOpen = !document.getElementById('newOrgOverlay').classList.contains('hidden');
    if(newOrgOpen){ closeNewOrgDialog(); } else { closeOrgPanel(); }
  }
});

/* ============================= 저장 / 보관함 (Google Apps Script 백엔드) ============================= */
function isConfigured(){
  if(APPS_SCRIPT_URL.indexOf('여기에_배포된')>-1){
    alert('먼저 코드 상단의 APPS_SCRIPT_URL 값을 배포한 Apps Script 웹앱 주소로 바꿔주세요.');
    return false;
  }
  return true;
}

function jsonp(params){
  return new Promise(function(resolve, reject){
    var cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    var script = document.createElement('script');
    var timer = setTimeout(function(){ cleanup(); reject(new Error('요청 시간 초과')); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function(data){ cleanup(); resolve(data); };
    var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    script.src = APPS_SCRIPT_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function(){ cleanup(); reject(new Error('네트워크 오류')); };
    document.body.appendChild(script);
  });
}

function postToScript(body){
  return fetch(APPS_SCRIPT_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
}

function saveMeeting(){
  var m = state.meeting;
  if(!m.ordinal){ alert('회차(제 몇 차)를 먼저 입력해주세요.'); return; }
  if(!isConfigured()) return;
  m.id = String(m.ordinal);
  var badge = document.getElementById('saveBadge');
  badge.textContent='저장 중…'; badge.style.color='#B9C2D6';
  postToScript({action:'save', meeting:m}).then(function(){
    markClean();
  }).catch(function(err){
    console.error(err);
    alert('저장 중 오류가 발생했습니다. 네트워크 설정에서 script.google.com 접속이 허용되어 있는지 확인해주세요.');
  });
}

function newMeeting(){
  if(dirty && !confirm('저장하지 않은 변경사항이 있습니다. 새 회의를 시작할까요?')) return;
  var m = blankMeeting();
  var n = parseFloat(state.meeting.ordinal);
  if(!isNaN(n)) m.ordinal = String(n+1);
  state.meeting = m;
  currentAnchor='cover';
  editMode = true;
  markDirty();
  render();
  closeArchive();
}

var archiveFullCache = [];   // 서버에서 받아온 전체 목록 (빠른 필터용)
var archiveIndexCache = [];  // 지금 화면에 실제로 그려지는 목록
var lastSearchQuery = '';    // 마지막으로 실행한 "내용 전체 검색" 검색어
var lastSearchResults = [];  // 그 검색의 결과 목록 (목록으로 돌아가기용)
var searchMatches = [];      // 현재 불러온 회의 안에서 검색어가 등장하는 위치들
var searchMatchIndex = -1;

function openArchive(){
  document.getElementById('archiveOverlay').classList.remove('hidden');
  document.getElementById('archiveSearch').value = '';
  lastSearchQuery = ''; lastSearchResults = [];
  archiveFullCache = []; archiveIndexCache = [];
  clearSearchMatches();
  document.getElementById('archiveList').innerHTML =
    '<div class="archive-empty">검색어를 입력하고 Enter를 누르거나,<br>아래 "🔄 목록 새로고침"을 눌러 전체 목록을 확인하세요.</div>';
}
function closeArchive(){ document.getElementById('archiveOverlay').classList.add('hidden'); }

function refreshArchiveIndex(){
  var list = document.getElementById('archiveList');
  list.innerHTML = '<div class="archive-empty">불러오는 중…</div>';
  if(!isConfigured()){ list.innerHTML = '<div class="archive-empty">먼저 배포 URL을 설정해주세요.</div>'; return; }
  jsonp({action:'list'}).then(function(res){
    if(res && res.ok){
      archiveFullCache = res.items;
      applyQuickFilter();
    } else {
      archiveFullCache = []; archiveIndexCache = [];
      list.innerHTML = '<div class="archive-empty">서버 오류:<br>'+esc(res && res.error ? res.error : '알 수 없는 오류')+'</div>';
    }
  }).catch(function(err){
    archiveFullCache = []; archiveIndexCache = [];
    list.innerHTML = '<div class="archive-empty">불러오기 실패:<br>'+esc(err && err.message ? err.message : String(err))+'</div>';
  });
}

/* 검색창에 입력하는 즉시 실행되는, 회차/날짜/교회명만 보는 빠른 필터
   (서버 왕복 없이 archiveFullCache를 그대로 걸러서 보여줌) */
function applyQuickFilter(){
  var q = (document.getElementById('archiveSearch').value||'').trim().toLowerCase();
  var items = archiveFullCache.filter(function(x){
    if(!q) return true;
    var hay = [x.id,x.ordinal,x.dateDisplay,x.dateISO,x.hostChurchKo].join(' ').toLowerCase();
    return hay.indexOf(q)>-1;
  });
  archiveIndexCache = items;
  renderArchiveList();
}

/* archiveIndexCache를 있는 그대로 그리기만 함 — 추가로 다시 걸러내지 않음. */
function renderArchiveList(){
  var list = document.getElementById('archiveList');
  var items = archiveIndexCache;
  if(items.length===0){ list.innerHTML='<div class="archive-empty">저장된 회의안이 없습니다.<br>먼저 "저장"을 눌러 보관해보세요.</div>'; return; }
  var out = '';
  items.forEach(function(x){
    out += '<div class="archive-item js-load-meeting" data-id="'+esc(x.id)+'"><div class="t">제 '+esc(x.ordinal)+' 차 정기노회</div><div class="d">'+esc(x.dateDisplay||'')+' · '+esc(x.hostChurchKo||'')+'</div></div>';
  });
  list.innerHTML = out;
}

function doContentSearch(){
  var q = (document.getElementById('archiveSearch').value||'').trim();
  if(!q){ refreshArchiveIndex(); return; }
  if(!isConfigured()) return;
  var list = document.getElementById('archiveList');
  list.innerHTML = '<div class="archive-empty">내용 검색 중…</div>';
  jsonp({action:'search', q:q}).then(function(res){
    if(res && res.ok){
      archiveIndexCache = res.items;
      lastSearchQuery = q;
      lastSearchResults = res.items;
      renderArchiveList();
    } else {
      archiveIndexCache = [];
      list.innerHTML = '<div class="archive-empty">검색 서버 오류:<br>'+esc(res && res.error ? res.error : '알 수 없는 오류')+'</div>';
    }
    selectSearchBox();
  }).catch(function(err){
    list.innerHTML = '<div class="archive-empty">검색 요청 실패:<br>'+esc(err && err.message ? err.message : String(err))+'</div>';
    selectSearchBox();
  });
}

/* 검색이 끝나면 검색어를 통째로 선택해둬서, 바로 다음 검색어를 타이핑하면
   이전 검색어가 자동으로 지워지고 새로 입력되게 합니다. */
function selectSearchBox(){
  var box = document.getElementById('archiveSearch');
  box.focus();
  box.select();
}

function loadMeeting(id){
  if(!isConfigured()) return;
  jsonp({action:'get', id:id}).then(function(res){
    if(!res || !res.ok || !res.meeting){ alert('불러오기에 실패했습니다.'); return; }
    state.meeting = res.meeting;
    currentAnchor='cover';
    markClean();
    render();
    closeArchive();
    window.scrollTo(0,0);
    if(lastSearchQuery){
      setTimeout(function(){ showSearchMatches(lastSearchQuery); }, 60);
    } else {
      clearSearchMatches();
    }
  }).catch(function(){ alert('불러오기 중 오류가 발생했습니다.'); });
}

var orgState = null;
var orgLoaded = false;

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function getOrgPath(path){
  var o = orgState;
  for(var i=0;i<path.length;i++){ if(o==null) return o; o = o[path[i]]; }
  return o;
}
function setOrgField(path, value){
  var parent = getOrgPath(path.slice(0,-1));
  if(parent==null) return;
  parent[path[path.length-1]] = value;
  markOrgDirty();
}
function markOrgDirty(){ var b=document.getElementById('orgSaveBadge'); b.textContent='저장 안 된 변경사항 있음'; b.style.color='#b45309'; }
function markOrgClean(){ var b=document.getElementById('orgSaveBadge'); b.textContent='저장됨'; b.style.color='#2f6b3a'; }

}

/** 왼쪽이 비어있는데 오른쪽에 이름이 들어있으면(빈 칸 옆에 이름이 떠보이는 현상)
    자동으로 왼쪽으로 옮겨줍니다. 좌/우가 둘 다 이름이 있으면 그대로 둡니다. */
function normalizeOrgData(d){
  function stripTrailingBlanks(arr){
    var a = (arr||[]).slice();
    while(a.length && (a[a.length-1]||'').trim()===''){ a.pop(); }
    return a;
  }
  d.committees.forEach(function(comm){
    ['col1_left','col1_right','col2_left','col2_right','col3_left','col3_right'].forEach(function(f){
      comm[f] = stripTrailingBlanks(comm[f]);
    });
    ['col1','col2','col3'].forEach(function(c){
      var leftField = c+'_left', rightField = c+'_right';
      var left = comm[leftField]||[];
      var right = comm[rightField]||[];
      if(left.length===0 && right.length>0){
        comm[leftField] = right;
        comm[rightField] = [];
      }
    });
  });
  return d;
}

function loadOrgData(){
  var body = document.getElementById('orgBody');
  body.innerHTML = '<div class="archive-empty">불러오는 중…</div>';
  if(!isConfigured()){ body.innerHTML = '<div class="archive-empty">먼저 배포 URL을 설정해주세요.</div>'; return; }
  jsonp({action:'getOrg'}).then(function(res){
    if(res && res.ok){
      orgState = res.org ? res.org : deepClone(orgInitialData);
      if(!orgState.year) orgState.year = new Date().getFullYear();
      normalizeOrgData(orgState);
      orgLoaded = true;
      markOrgClean();
      renderOrgBody();
    } else {
      body.innerHTML = '<div class="archive-empty">서버 오류:<br>'+esc(res && res.error ? res.error : '알 수 없는 오류')+'</div>';
    }
  }).catch(function(err){
    body.innerHTML = '<div class="archive-empty">불러오기 실패:<br>'+esc(err && err.message ? err.message : String(err))+'</div>';
  });
}

/** 저장 시에는 화면에 보이는 빈 칸(패딩용 빈 문자열)을 걸러내고 실제 이름만 서버에 보냅니다. */
function pruneEmptyNames(state){
  var clean = deepClone(state);
  clean.committees.forEach(function(comm){
    ['col1_left','col1_right','col2_left','col2_right','col3_left','col3_right'].forEach(function(field){
      comm[field] = (comm[field]||[]).filter(function(n){ return (n||'').trim()!==''; });
    });
  });
  return clean;
}

function saveOrgData(){
  if(!orgState || !isConfigured()) return;
  var badge = document.getElementById('orgSaveBadge');
  badge.textContent='저장 중…'; badge.style.color='var(--ink-soft)';
  var payload = pruneEmptyNames(orgState);
  postToScript({action:'saveOrg', year: orgState.year, org: payload}).then(function(){
    markOrgClean();
  }).catch(function(err){
    console.error(err);
    alert('저장 중 오류가 발생했습니다.');
  });
}

  document.getElementById('newOrgYear').value = suggested;
  document.getElementById('newOrgOverlay').classList.remove('hidden');
}
function closeNewOrgDialog(){ document.getElementById('newOrgOverlay').classList.add('hidden'); }
function confirmNewOrg(mode){
  var year = parseInt(document.getElementById('newOrgYear').value, 10);
  if(!year){ alert('생성년도를 입력해주세요.'); return; }
  if(mode==='copy' && orgState){
    orgState = deepClone(orgState);
  } else {
    orgState = deepClone(orgInitialData);
    orgState.executives.forEach(function(ex){ ex.name=''; });
    orgState.committees.forEach(function(comm){
      ['col1_left','col1_right','col2_left','col2_right','col3_left','col3_right'].forEach(function(f){ comm[f]=[]; });
    });
  }
  orgState.year = year;
  normalizeOrgData(orgState);
  orgLoaded = true;
  closeNewOrgDialog();
  renderOrgBody();
  markOrgDirty();
  saveOrgData();
}

        .concat(comm.col3_left||[]).concat(comm.col3_right||[]);
      var grid = names.length
        ? '<div class="op-merged-grid">'+names.map(function(n){ return '<div>'+esc(n)+'</div>'; }).join('')+'</div>'
        : '-';
      out += '<td colspan="3">'+grid+'</td>';
    } else {
      ['col1','col2','col3'].forEach(function(c){
        var names = (comm[c+'_left']||[]).concat(comm[c+'_right']||[]);
        out += '<td>'+(names.length ? names.map(esc).join('<br>') : '-')+'</td>';
      });
    }
    out += '</tr>';
  });
  out += '</tbody></table>';
  document.getElementById('orgPrintView').innerHTML = out;
}

function printOrgPanel(){
  if(!orgState) return;
  buildOrgPrintView();
  document.body.classList.add('printing-org');

  var printPageStyle = document.createElement('style');
  printPageStyle.id = 'orgPrintPageStyle';
  printPageStyle.textContent = '@page{ size: portrait; margin: 0.4in; }';
  document.head.appendChild(printPageStyle);

  window.print();
}
window.addEventListener('afterprint', function(){
  document.body.classList.remove('printing-org');
  var printPageStyle = document.getElementById('orgPrintPageStyle');
  if(printPageStyle) printPageStyle.parentNode.removeChild(printPageStyle);
  var view = document.getElementById('orgPrintView');
  if(view){ view.innerHTML=''; }
});

/* 목록을 최소 2칸까지 빈 칸으로 채워서 보여줍니다 (실제 데이터에는 저장 시점에만 반영). */
function paddedList(arr){
  var a = (arr||[]).slice();
  while(a.length && (a[a.length-1]||'').trim()===''){ a.pop(); }
  while(a.length < 1) a.push('');
  return a;
}

function renderOrgBody(){
  var d = orgState;
  updateOrgTitle();
  var out = '';
  out += '<div class="org-exec-grid">';
  d.executives.slice(0,6).forEach(function(ex, i){
    out += '<div class="org-exec-chip"><span class="lbl">'+esc(ex.title)+'</span><input class="org-field" data-path="'+esc(JSON.stringify(['executives',i,'name']))+'" value="'+esc(ex.name)+'"></div>';
  });
  out += '</div>';
  out += '<div class="org-exec-wide">';
  d.executives.slice(6,8).forEach(function(ex, idx){
    var i = idx+6;
    out += '<div class="org-exec-wide-row"><span class="lbl">'+esc(ex.title)+'</span><input class="org-field" data-path="'+esc(JSON.stringify(['executives',i,'name']))+'" value="'+esc(ex.name)+'"></div>';
  });
  out += '</div>';

  out += '<div class="org-table-wrap"><table class="org-table"><thead><tr><th>위원회 명칭</th>';
  ['col1','col2','col3'].forEach(function(c){
    out += '<th><input class="org-field" data-path="'+esc(JSON.stringify(['columnTitles',c]))+'" value="'+esc(d.columnTitles[c])+'"></th>';
  });
  out += '</tr></thead><tbody>';
  var MERGED_COMMITTEES = { '상임 사법 전권':1, '준회원(MAL)':1, '총회, 해외':1 };

  d.committees.forEach(function(comm, ci){
    out += '<tr><td class="org-committee-name">'+formatCommitteeName(comm.name)+'</td>';
    if(MERGED_COMMITTEES[comm.name]){
      out += '<td colspan="3"><div class="org-cell-6">';
      ['col1','col2','col3'].forEach(function(c){
        ['left','right'].forEach(function(side){
          var field = c+'_'+side;
          var lp = JSON.stringify(['committees',ci,field]);
          var list = paddedList(comm[field]);
          out += '<div class="org-sublist" data-listpath="'+esc(lp)+'">';
          list.forEach(function(name, ni){
            var isEmpty = (name||'').trim()==='';
            out += '<div class="org-person-row"><input class="org-field org-person-field" data-path="'+esc(JSON.stringify(['committees',ci,field,ni]))+'" value="'+esc(name)+'" placeholder="입력"><button type="button" class="org-person-del'+(isEmpty?'':' org-hide')+'" data-listpath="'+esc(lp)+'" data-idx="'+ni+'">×</button></div>';
          });
          out += '</div>';
        });
      });
      out += '</div></td>';
    } else {
      ['col1','col2','col3'].forEach(function(c){
        out += '<td><div class="org-cell">';
        ['left','right'].forEach(function(side){
          var field = c+'_'+side;
          var lp = JSON.stringify(['committees',ci,field]);
          var list = paddedList(comm[field]);
          out += '<div class="org-sublist" data-listpath="'+esc(lp)+'">';
          list.forEach(function(name, ni){
            var isEmpty = (name||'').trim()==='';
            out += '<div class="org-person-row"><input class="org-field org-person-field" data-path="'+esc(JSON.stringify(['committees',ci,field,ni]))+'" value="'+esc(name)+'" placeholder="입력"><button type="button" class="org-person-del'+(isEmpty?'':' org-hide')+'" data-listpath="'+esc(lp)+'" data-idx="'+ni+'">×</button></div>';
          });
          out += '</div>';
        });
        out += '</div></td>';
      });
    }
    out += '</tr>';
  });
  out += '</tbody></table></div>';

  document.getElementById('orgBody').innerHTML = out;
}

document.getElementById('orgOverlay').addEventListener('click', function(e){
  if(e.target.id==='orgOverlay'){ closeOrgPanel(); return; }
  var delBtn = e.target.closest('.org-person-del');
  if(delBtn){
    var lp2 = JSON.parse(delBtn.dataset.listpath);
    var arr = getOrgPath(lp2);
    var idx = parseInt(delBtn.dataset.idx,10);
    if(idx < arr.length) arr.splice(idx, 1);
    markOrgDirty(); renderOrgBody();
    return;
  }
});
document.getElementById('orgOverlay').addEventListener('input', function(e){
  var el = e.target;
  if(!el.classList.contains('org-field')) return;
  setOrgField(JSON.parse(el.dataset.path), el.value);
  if(el.classList.contains('org-person-field')){
    var row = el.closest('.org-person-row');
    var delBtn = row.querySelector('.org-person-del');
    var isEmpty = el.value.trim()==='';
    delBtn.classList.toggle('org-hide', !isEmpty);
  }
});
function findSublistEl(path){
  var target = JSON.stringify(path);
  var found = null;
  document.querySelectorAll('.org-sublist').forEach(function(s){
    if(found) return;
    try{ if(JSON.stringify(JSON.parse(s.dataset.listpath))===target){ found = s; } }catch(err){}
  });
  return found;
}
function focusLastOf(path){
  var s = findSublistEl(path);
  if(s){
    var ins = s.querySelectorAll('.org-person-field');
    if(ins.length) ins[ins.length-1].focus();
  }
}

document.getElementById('orgOverlay').addEventListener('keydown', function(e){
  if(e.key!=='Enter' || !e.target.classList.contains('org-person-field')) return;
  e.preventDefault();
  var sub = e.target.closest('.org-sublist');
  var inputs = Array.from(sub.querySelectorAll('.org-person-field'));
  var myIndex = inputs.indexOf(e.target);
  if(myIndex < inputs.length - 1){
    inputs[myIndex+1].focus();
    return;
  }
  var lp = JSON.parse(sub.dataset.listpath);
  var field = lp[lp.length-1];
  var isLeft = /_left$/.test(field);
  var pairField = isLeft ? field.replace(/_left$/,'_right') : field.replace(/_right$/,'_left');
  var pairPath = lp.slice(0,-1).concat([pairField]);

  if(!isLeft){
    // 오른쪽(두번째) 칸의 마지막: 항상 다음 줄 왼쪽에 새 칸 하나만
    getOrgPath(pairPath).push('');
    markOrgDirty(); renderOrgBody();
    focusLastOf(pairPath);
    return;
  }

  // 왼쪽(첫번째) 칸의 마지막: 같은 줄 오른쪽이 비어있으면 그쪽으로, 없으면 오른쪽에 새로 하나,
  // 오른쪽이 이미 채워져 있으면 왼쪽에 새 줄 하나
  var pairSub = findSublistEl(pairPath);
  var pairInputs = pairSub ? pairSub.querySelectorAll('.org-person-field') : [];
  if(pairInputs.length > myIndex && pairInputs[myIndex].value.trim()===''){
    pairInputs[myIndex].focus();
  } else if(pairInputs.length <= myIndex){
    getOrgPath(pairPath).push('');
    markOrgDirty(); renderOrgBody();
    focusLastOf(pairPath);
  } else {
    getOrgPath(lp).push('');
    markOrgDirty(); renderOrgBody();
    focusLastOf(lp);
  }
});
document.getElementById('newOrgOverlay').addEventListener('click', function(e){ if(e.target.id==='newOrgOverlay') closeNewOrgDialog(); });

/* ---------- 검색어 위치 찾기 / 하이라이트 / 이동 ---------- */
function collectMatches(query){
  var q = (query||'').trim().toLowerCase();
  if(!q) return [];
  var matches = [];
  var sections = state.meeting.sections;
  var order = ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12'];
  order.forEach(function(k){
    var sec = sections[k];
    if(!sec) return;
    if(sec.kind==='lines'){
      (sec.lines||[]).forEach(function(line, idx){
        if((line.text||'').toLowerCase().indexOf(q)>-1){
          matches.push({path:['meeting','sections',k,'lines'], idx:idx});
        }
      });
    } else if(sec.kind==='sub'){
      (sec.subs||[]).forEach(function(sub, si){
        if((sub.label||'').toLowerCase().indexOf(q)>-1){
          matches.push({subLabelOnly:true, skey:k, subidx:si});
        }
        (sub.lines||[]).forEach(function(line, idx){
          if((line.text||'').toLowerCase().indexOf(q)>-1){
            matches.push({path:['meeting','sections',k,'subs',si,'lines'], idx:idx});
          }
        });
      });
    }
  });
  return matches;
}

function findMatchElement(m){
  if(m.subLabelOnly){
    return document.querySelector('#sec-'+m.skey+'-sub-'+m.subidx+' .sub-label');
  }
  var target = JSON.stringify(m.path);
  var found = null;
  document.querySelectorAll('.line-text[data-idx]').forEach(function(el){
    if(found || el.dataset.path===undefined) return;
    try{
      var p = JSON.parse(el.dataset.path);
      if(JSON.stringify(p)===target && parseInt(el.dataset.idx,10)===m.idx){ found = el.closest('.line'); }
    }catch(e){}
  });
  return found;
}

function applyMatchHighlights(){
  document.querySelectorAll('.search-hit,.search-hit-current').forEach(function(el){
    el.classList.remove('search-hit','search-hit-current');
  });
  searchMatches.forEach(function(m, i){
    var el = findMatchElement(m);
    if(el) el.classList.add(i===searchMatchIndex ? 'search-hit-current' : 'search-hit');
  });
}

function scrollToMatch(i){
  var m = searchMatches[i];
  if(!m) return;
  var el = findMatchElement(m);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function showSearchMatches(query){
  searchMatches = collectMatches(query);
  searchMatchIndex = searchMatches.length ? 0 : -1;
  renderSearchNavBar();
  applyMatchHighlights();
  if(searchMatchIndex>=0) scrollToMatch(searchMatchIndex);
}

function nextMatch(){
  if(!searchMatches.length) return;
  searchMatchIndex = (searchMatchIndex+1) % searchMatches.length;
  applyMatchHighlights(); scrollToMatch(searchMatchIndex); updateSearchNavBar();
}
function prevMatch(){
  if(!searchMatches.length) return;
  searchMatchIndex = (searchMatchIndex-1+searchMatches.length) % searchMatches.length;
  applyMatchHighlights(); scrollToMatch(searchMatchIndex); updateSearchNavBar();
}

function backToSearchResults(){
  document.getElementById('archiveOverlay').classList.remove('hidden');
  document.getElementById('archiveSearch').value = lastSearchQuery;
  archiveIndexCache = lastSearchResults;
  renderArchiveList();
}

function clearSearchMatches(){
  searchMatches = []; searchMatchIndex = -1;
  document.querySelectorAll('.search-hit,.search-hit-current').forEach(function(el){
    el.classList.remove('search-hit','search-hit-current');
  });
  var bar = document.getElementById('searchNavBar');
  if(bar) bar.parentNode.removeChild(bar);
}

function renderSearchNavBar(){
  var bar = document.getElementById('searchNavBar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'searchNavBar';
    bar.className = 'search-nav-bar';
    document.body.appendChild(bar);
  }
  updateSearchNavBar();
}

function updateSearchNavBar(){
  var bar = document.getElementById('searchNavBar');
  if(!bar) return;
  if(!searchMatches.length){
    bar.innerHTML = '<span>"'+esc(lastSearchQuery)+'" 일치 항목 없음</span>';
  } else {
    bar.innerHTML =
      '<span>🔎 "'+esc(lastSearchQuery)+'" '+(searchMatchIndex+1)+' / '+searchMatches.length+'</span>'+
      '<button type="button" id="snbPrev">◀ 이전</button>'+
      '<button type="button" id="snbNext">다음 ▶</button>'+
      '<button type="button" id="snbBack">목록으로</button>';
  }
  bar.innerHTML += '<button type="button" id="snbClose">✕</button>';
  var prevBtn = bar.querySelector('#snbPrev'); if(prevBtn) prevBtn.onclick = prevMatch;
  var nextBtn = bar.querySelector('#snbNext'); if(nextBtn) nextBtn.onclick = nextMatch;
  var backBtn = bar.querySelector('#snbBack'); if(backBtn) backBtn.onclick = backToSearchResults;
  bar.querySelector('#snbClose').onclick = clearSearchMatches;
}


/* ============================= 초기화 ============================= */
render();
markDirty();

/* 인쇄 시에는 항상 "보기모드"(원본 PDF 형식에 가까운, 테두리·버튼 없는 화면)로
   임시 전환한 뒤 인쇄가 끝나면 원래 모드로 되돌립니다. */
var printPrevEditMode = null;
window.addEventListener('beforeprint', function(){
  printPrevEditMode = editMode;
  if(editMode){ editMode = false; render(); }
});
window.addEventListener('afterprint', function(){
  if(printPrevEditMode){ editMode = true; render(); }
  printPrevEditMode = null;
});
</script>
