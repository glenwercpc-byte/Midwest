<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>중서부 한미노회 · 정기노회 회의안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A44;
  --ink-soft:#3B4A6B;
  --paper:#F6F1E7;
  --paper-deep:#EFE7D6;
  --edge:#D9CFBB;
  --gold:#A9822C;
  --gold-soft:#DFC98C;
  --maroon:#7A2E2E;
  --maroon-soft:#F1DCDA;
  --navy-soft:#DDE3EF;
  --sub:#6b6a5e;
  --white:#FFFDF8;
  --shadow: 0 1px 2px rgba(30,42,68,.06), 0 8px 24px rgba(30,42,68,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background: linear-gradient(180deg,#EAE3D2 0%, #E3D9C4 100%);
  color:var(--ink);
  min-height:100vh;
}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ---------- Toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  background:var(--ink);
  color:var(--white);
  flex-wrap:wrap;
}
.toolbar .brand{
  font-family:'Noto Serif KR',serif;
  font-weight:600;font-size:15px;
  letter-spacing:.02em;
  margin-right:auto;
  white-space:nowrap;
}
.toolbar .brand small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:11px;color:#B9C2D6;}
.tbtn{
  appearance:none;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);color:var(--white);
  padding:8px 12px;border-radius:7px;font-size:13px;font-weight:500;
  cursor:pointer;transition:background .15s ease;white-space:nowrap;
  font-family:'Noto Sans KR',sans-serif;
}
.tbtn:hover{background:rgba(255,255,255,.16);}
.tbtn.primary{background:var(--gold);border-color:var(--gold);color:#241C08;font-weight:700;}
.tbtn.primary:hover{background:#BC943A;}
.tbtn.mode-locked{background:var(--maroon-soft);color:var(--maroon);border-color:var(--maroon-soft);}
.tbtn.mode-edit{background:var(--gold-soft);color:#4a3a05;border-color:var(--gold-soft);}
.savebadge{font-size:12px;color:#B9C2D6;white-space:nowrap;}

/* ---------- Workspace ---------- */
.workspace{display:flex;flex:1;min-height:0;}
#tocPanel{
  width:270px;flex:0 0 270px;
  background:var(--paper-deep);
  border-right:1px solid var(--edge);
  padding:18px 14px 40px;
  overflow-y:auto;
  max-height:calc(100vh - 54px);
  position:sticky;top:54px;align-self:flex-start;
}
#tocPanel h3{
  font-family:'Noto Serif KR',serif;font-size:13px;color:var(--sub);
  margin:0 0 10px 4px;font-weight:600;letter-spacing:.03em;
}
.toc-item{
  display:block;width:100%;text-align:left;
  background:none;border:none;cursor:pointer;
  padding:7px 8px;border-radius:6px;
  font-family:'Noto Serif KR',serif;font-size:13.5px;color:var(--ink-soft);
  line-height:1.4;
}
.toc-item:hover{background:var(--navy-soft);}
.toc-item .n{color:var(--gold);font-weight:700;margin-right:6px;}
.toc-item.active{background:var(--ink);color:var(--white);}
.toc-item.active .n{color:var(--gold-soft);}
.toc-sub{padding-left:20px;font-size:12.5px;color:var(--sub);}
.toc-sub:hover{background:var(--navy-soft);}
.backbar{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
}
.backbtn{
  background:var(--white);border:1px solid var(--edge);
  border-radius:7px;padding:7px 10px;font-size:12.5px;
  cursor:pointer;color:var(--ink-soft);font-weight:600;
}
.backbtn:disabled{opacity:.35;cursor:default;}

#docPanel{flex:1;min-width:0;padding:32px 20px 120px;display:flex;flex-direction:column;align-items:center;}

/* ---------- Paper / document ---------- */
.page{
  width:100%;max-width:760px;
  background:var(--paper);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
  padding:46px 52px;
  margin-bottom:26px;
  border-radius:2px;
  position:relative;
}
.page::before{
  content:"";position:absolute;inset:10px;
  border:1px solid var(--edge);pointer-events:none;opacity:.55;
}
.cover{text-align:center;}
.emblem{margin:6px auto 18px;width:74px;height:74px;}
.cover h1{
  font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:26px;line-height:1.45;margin:4px 0 2px;color:var(--ink);
}
.cover .ordinal-field{
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:26px;
  color:var(--maroon);
}
.cover .en-title{
  font-size:14px;color:var(--sub);margin:14px 0 26px;line-height:1.7;
}
.cover .rule{width:64px;height:2px;background:var(--gold);margin:22px auto;}
.cover .dt{font-family:'Noto Serif KR',serif;font-size:17px;margin:20px 0 2px;}
.cover .venue-card{
  margin:34px auto 0;padding:18px 22px;border:1px solid var(--edge);
  background:var(--white);border-radius:6px;max-width:420px;
}
.cover .venue-card .host{font-family:'Noto Serif KR',serif;font-weight:600;font-size:17px;color:var(--maroon);}
.cover .venue-card .pastor{font-size:13.5px;color:var(--ink-soft);margin-top:6px;}
.cover .venue-card .addr{font-size:12.5px;color:var(--sub);margin-top:2px;}

.doc-header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px;}
.doc-header .org{font-size:11.5px;color:var(--sub);text-align:center;letter-spacing:.03em;}
.doc-header h2{
  font-family:'Noto Serif KR',serif;font-size:19px;text-align:center;
  margin:10px 0 14px;color:var(--ink);
}
.meta-row{display:flex;gap:24px;justify-content:center;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
.meta-row b{color:var(--ink);}

.roman-block{margin:20px 0 26px;}
.roman-block h4{
  font-family:'Noto Serif KR',serif;font-size:14.5px;color:var(--maroon);
  margin:0 0 8px;display:flex;align-items:center;gap:8px;
}
.roman-block h4 .chair{font-size:12px;color:var(--sub);font-weight:400;font-family:'Noto Sans KR',sans-serif;}
.role-grid{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;font-size:13px;}
.role-grid .k{color:var(--sub);}
.role-grid input{
  border:none;border-bottom:1px dotted var(--edge);background:transparent;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--ink);
  padding:2px 2px;width:100%;
}
.role-grid input:disabled{color:var(--ink);opacity:1;}
.role-grid input:focus{outline:none;border-bottom:1px solid var(--gold);}

/* section blocks (items 1-12) */
.section-block{margin:0 0 30px;scroll-margin-top:70px;}
.section-block .sec-title{
  display:flex;align-items:baseline;gap:10px;
  font-family:'Noto Serif KR',serif;font-size:15.5px;font-weight:600;
  color:var(--ink);border-bottom:1px solid var(--edge);padding-bottom:8px;margin-bottom:12px;
}
.section-block .sec-title .num{
  color:var(--white);background:var(--ink);border-radius:5px;
  width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;flex:0 0 auto;
}
.section-block .sec-title input.title-edit{
  font-family:'Noto Serif KR',serif;font-weight:600;font-size:15.5px;
  border:none;background:transparent;flex:1;color:var(--ink);
}
.section-block .sec-title input.title-edit:focus{outline:none;border-bottom:1px solid var(--gold);}

.sub-block{margin:0 0 18px;padding-left:2px;scroll-margin-top:70px;}
.sub-block .sub-label{
  display:flex;align-items:center;gap:8px;
  font-family:'Noto Serif KR',serif;font-size:13.5px;font-weight:600;color:var(--ink-soft);
  margin-bottom:6px;
}
.sub-block .sub-label input{
  font-family:'Noto Serif KR',serif;font-weight:600;font-size:13.5px;color:var(--ink-soft);
  border:none;background:transparent;flex:1;
}
.sub-block .sub-label input:focus{outline:none;border-bottom:1px solid var(--gold);}
.sub-block .subdel{
  background:none;border:none;color:var(--sub);cursor:pointer;font-size:12px;
}

.line{
  display:flex;align-items:flex-start;gap:8px;margin:6px 0;
  padding:5px 8px;border-radius:5px;
}
.line:hover{background:rgba(169,130,44,.06);}
.line .line-num{color:var(--gold);font-size:12px;font-weight:700;margin-top:8px;flex:0 0 16px;}
.line .line-text{
  flex:1;border:none;border-bottom:1px solid transparent;background:transparent;
  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:var(--ink);
  padding:6px 2px;line-height:1.5;resize:none;min-height:32px;
}
.line .line-text:focus{outline:none;border-bottom:1px solid var(--gold);}
.line .tag-pill{
  flex:0 0 auto;font-size:11px;font-weight:700;border:none;border-radius:11px;
  padding:5px 9px;margin-top:2px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
}
.tag-report{background:var(--navy-soft);color:var(--ink-soft);}
.tag-motion{background:var(--maroon-soft);color:var(--maroon);}
.tag-none{background:transparent;color:var(--sub);border:1px dashed var(--edge)!important;}
.line .attach-chip{
  flex:0 0 auto;font-size:11.5px;font-weight:600;border:1px solid var(--gold);
  background:var(--gold-soft);color:#4a3a05;border-radius:11px;padding:5px 10px;
  cursor:pointer;white-space:nowrap;margin-top:2px;
}
.line .line-del{
  flex:0 0 auto;background:none;border:none;color:#b04a4a;cursor:pointer;
  font-size:14px;padding:4px;margin-top:3px;
}
.addline-btn, .addsub-btn{
  background:none;border:1px dashed var(--edge);color:var(--sub);
  font-size:12.5px;padding:7px 12px;border-radius:6px;cursor:pointer;margin-top:4px;
  font-family:'Noto Sans KR',sans-serif;
}
.addline-btn:hover, .addsub-btn:hover{border-color:var(--gold);color:var(--gold);}

/* TOC-in-document (item 4) */
.toc-render{border:1px solid var(--edge);background:var(--white);border-radius:6px;overflow:hidden;}
.toc-render .toc-row{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--edge);cursor:pointer;font-size:13.5px;
  font-family:'Noto Serif KR',serif;color:var(--ink);
}
.toc-render .toc-row:last-child{border-bottom:none;}
.toc-render .toc-row:hover{background:var(--paper-deep);}
.toc-render .toc-row .n{
  width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--white);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;
}
.toc-render .toc-subrow{
  padding:6px 14px 6px 44px;font-size:12.5px;color:var(--sub);cursor:pointer;
  border-bottom:1px dashed var(--edge);
}
.toc-render .toc-subrow:hover{background:var(--paper-deep);color:var(--ink);}

.next-grid{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:13.5px;max-width:480px;}
.next-grid .k{color:var(--sub);}
.next-grid input{border:none;border-bottom:1px dotted var(--edge);background:transparent;font-size:13.5px;padding:3px 2px;width:100%;font-family:'Noto Sans KR',sans-serif;}
.next-grid input:focus{outline:none;border-bottom:1px solid var(--gold);}

.footer-note{text-align:center;color:var(--sub);font-size:11.5px;margin-top:6px;}

/* ---------- Modal ---------- */
#modalOverlay{
  position:fixed;inset:0;background:rgba(20,20,15,.5);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
#modalOverlay.hidden{display:none;}
.modal-box{
  background:var(--white);max-width:560px;width:100%;max-height:80vh;overflow-y:auto;
  border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--edge);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--edge);background:var(--paper-deep);
  border-radius:8px 8px 0 0;
}
.modal-head h3{font-family:'Noto Serif KR',serif;font-size:15px;margin:0;color:var(--ink);}
.modal-close{
  background:var(--ink);color:var(--white);border:none;border-radius:50%;
  width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;
}
.modal-body{padding:18px 20px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;color:var(--ink-soft);}
.modal-body textarea{
  width:100%;min-height:160px;border:1px solid var(--edge);border-radius:6px;padding:10px;
  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.6;
}

/* ---------- Archive panel ---------- */
#archiveOverlay{position:fixed;inset:0;background:rgba(20,20,15,.5);display:flex;justify-content:flex-end;z-index:90;}
#archiveOverlay.hidden{display:none;}
.archive-panel{width:100%;max-width:420px;background:var(--paper);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);}
.archive-head{padding:18px 20px;border-bottom:1px solid var(--edge);background:var(--ink);color:var(--white);display:flex;justify-content:space-between;align-items:center;}
.archive-head h3{font-family:'Noto Serif KR',serif;margin:0;font-size:16px;}
.archive-body{padding:16px 20px;}
.archive-search{width:100%;padding:10px 12px;border:1px solid var(--edge);border-radius:7px;font-size:13.5px;margin-bottom:14px;font-family:'Noto Sans KR',sans-serif;}
.archive-item{
  background:var(--white);border:1px solid var(--edge);border-radius:7px;padding:12px 14px;
  margin-bottom:10px;cursor:pointer;
}
.archive-item:hover{border-color:var(--gold);}
.archive-item .t{font-family:'Noto Serif KR',serif;font-weight:600;color:var(--ink);font-size:14px;}
.archive-item .d{font-size:12px;color:var(--sub);margin-top:3px;}
.archive-empty{color:var(--sub);font-size:13px;text-align:center;margin-top:30px;}
.archive-actions{display:flex;gap:8px;margin-bottom:14px;}
.archive-actions button{
  flex:1;padding:9px;border-radius:7px;border:1px solid var(--edge);background:var(--white);
  font-size:12.5px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:600;color:var(--ink-soft);
}
.archive-actions button.danger{color:var(--maroon);border-color:var(--maroon-soft);}

@media (max-width:860px){
  #tocPanel{position:fixed;left:0;top:54px;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;max-height:none;width:82%;box-shadow:8px 0 30px rgba(0,0,0,.25);}
  #tocPanel.open{transform:translateX(0);}
  .page{padding:30px 20px;}
  .toolbar .brand small{display:none;}
}
@media print{
  .toolbar,#tocPanel,#archiveOverlay,#modalOverlay,.line-del,.addline-btn,.addsub-btn,.subdel{display:none!important;}
  #docPanel{padding:0;}
  .page{box-shadow:none;border:none;margin:0;page-break-after:always;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <div class="brand">중서부 한미노회 회의안<br><small id="brandSub">제 — 차 정기노회</small></div>
    <button class="tbtn" id="tocToggleBtn" onclick="toggleTocPanel()">☰ 회순</button>
    <button class="tbtn" id="modeBtn" onclick="toggleEditMode()"></button>
    <span class="savebadge" id="saveBadge">저장 안 됨</span>
    <button class="tbtn" onclick="saveMeeting()">저장</button>
    <button class="tbtn" onclick="openArchive()">보관함 · 검색</button>
    <button class="tbtn" onclick="window.print()">인쇄 / PDF</button>
    <button class="tbtn primary" onclick="newMeeting()">새 회의</button>
  </div>

  <div class="workspace">
    <aside id="tocPanel">
      <div class="backbar">
        <button class="backbtn" id="backBtn" onclick="goBack()" disabled>← 이전 회순</button>
      </div>
      <h3>회순 (docket)</h3>
      <div id="tocList"></div>
    </aside>
    <main id="docPanel"></main>
  </div>
</div>

<div id="modalOverlay" class="hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">첨부서류</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="archiveOverlay" class="hidden">
  <div class="archive-panel">
    <div class="archive-head">
      <h3>보관함 · 검색</h3>
      <button class="modal-close" onclick="closeArchive()">✕</button>
    </div>
    <div class="archive-body">
      <input class="archive-search" id="archiveSearch" placeholder="회차, 날짜, 장소, 내용으로 검색…" oninput="renderArchiveList()">
      <div class="archive-actions">
        <button onclick="refreshArchiveIndex()">🔄 목록 새로고침</button>
        <button onclick="doContentSearch()">🔎 내용 전체 검색</button>
      </div>
      <div id="archiveList"></div>
    </div>
  </div>
</div>

<script>
/* ============================= 백엔드 설정 (Google Apps Script) =============================
   아래 URL을 Apps Script 프로젝트를 웹앱으로 배포한 뒤 받는 주소로 바꿔주세요.
   (배포 방법은 함께 전달된 안내를 참고하세요) */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwSC09xHX_xnYMxstx10S_SvFwUP7Z1PXMVQ-vkLRxtIvqYZny67oafdzdOLc8B6RGy/exec';

/* ============================= 데이터 모델 ============================= */
function blankLines(arr){ return (arr||[]).map(t=> typeof t==='string' ? {text:t,tag:'',hasAttachment:false,attachmentContent:''} : t); }

function makeSection(num,title,kind,extra){
  return Object.assign({num,title,kind, lines: kind==='lines'?[]:undefined, subs: kind==='sub'?[]:undefined}, extra||{});
}

function defaultSkeleton(){
  return {
    s1: makeSection('1','개회 (Call to Order)','static'),
    s2: makeSection('2','회원점명 & 방문자 소개와 인사','lines',{lines:[]}),
    s3: makeSection('3','개회 정족수 선언','lines',{lines:[]}),
    s4: makeSection('4','회순 채택 (Adoption of the Docket)','toc'),
    s5: makeSection('5','전 회의록 채택','lines',{lines:[{text:'전 회의록 채택',tag:'motion',hasAttachment:true,attachmentContent:''}]}),
    s6: makeSection('6','임원 보고 및 동의안','sub',{subs:[
        {key:'A',label:'노회장 보고 (Moderator Report)',lines:[]},
        {key:'B',label:'사무총장 보고 및 일정 (Executive Presbyter Report)',lines:[]},
        {key:'C',label:'서기 보고 (Stated Clerk Report)',lines:[]},
        {key:'D',label:'재정 보고 (Treasurer Report)',lines:[]},
        {key:'E',label:'임원회 보고 및 동의안 (Presbytery Officers Agendas)',lines:[]}
      ]}),
    s7: makeSection('7','실행위원회 동의안','lines',{lines:[]}),
    s8: makeSection('8','각 위원회 보고 및 동의안','sub',{subs:[
        {key:'A',label:'공천 위원회 (Nominating Committee)',lines:[]},
        {key:'B',label:'교육 및 목사 후보생 위원회 (Educational and Preparation for Ministry Committee)',lines:[]},
        {key:'C',label:'목회 위원회 (Committee on Ministry)',lines:[]},
        {key:'D',label:'선교 및 교회발전 위원회 (Mission and Church Development Committee)',lines:[]},
        {key:'E',label:'대표 및 정책기록위원회 (Committee on Representation and Policy and Record)',lines:[]},
        {key:'F',label:'법인 이사회 (Board of Trustee)',lines:[]},
        {key:'G',label:'로렌스장로교회 행정전권 위원회',lines:[]},
        {key:'H',label:'한사랑복음장로교회 행정전권 위원회',lines:[]},
        {key:'I',label:'상임사법전권위원회 (Permanent Judicial Commission)',lines:[]}
      ]}),
    s9: makeSection('9','다음 노회 일시 및 장소','next',{data:{ordinal:'',dateDisplay:'',venue:'',address:''}}),
    s10: makeSection('10','광고 (Announcements)','lines',{lines:[]}),
    s11: makeSection('11','폐회 기도 (Closing Prayer)','lines',{lines:[{text:''}]}),
    s12: makeSection('12','폐회 (Adjourn)','static')
  };
}

function blankMeeting(){
  return {
    id: '',
    ordinal:'',

/* ============================= 전역 상태 ============================= */
var state = { meeting: seedMeeting105() };
var editMode = false;
var navStack = [];
var currentAnchor = 's1';
var io = null;
var dirty = false;

/* ---------- 경로 유틸 ---------- */
function getPath(obj, path){ return path.reduce((o,k)=> (o==null?o:o[k]), obj); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function markDirty(){ dirty=true; document.getElementById('saveBadge').textContent='저장 안 된 변경사항 있음'; document.getElementById('saveBadge').style.color='#e2b04a'; }
function markClean(){ dirty=false; document.getElementById('saveBadge').textContent='저장됨'; document.getElementById('saveBadge').style.color='#B9C2D6'; }

/* 텍스트 입력: 구조를 바꾸지 않으므로 다시 그리지 않음(커서 유지) */
function setField(path, value){
  var parent = getPath(state, path.slice(0,-1));
  parent[path[path.length-1]] = value;
  markDirty();
  updateBrand();
}
/* 구조가 바뀌는 변경: 다시 그림 */
function setFieldRerender(path, value){ setField(path, value); render(); }

function addLine(path){
  var arr = getPath(state, path);
  arr.push({text:'',tag:'',hasAttachment:false,attachmentContent:''});
  markDirty(); render();
}
function removeLine(path, idx){
  var arr = getPath(state, path);
  arr.splice(idx,1);
  markDirty(); render();
}
function cycleTag(path, idx){
  var arr = getPath(state, path);
  var order = ['', 'report', 'motion'];
  var cur = order.indexOf(arr[idx].tag||'');
  arr[idx].tag = order[(cur+1)%order.length];
  markDirty(); render();
}
function toggleAttach(path, idx){
  var arr = getPath(state, path);
  arr[idx].hasAttachment = !arr[idx].hasAttachment;
  markDirty(); render();
}
function addSub(sKey){
  var subs = state.meeting.sections[sKey].subs;
  var letter = String.fromCharCode(65+subs.length);
  subs.push({key:letter,label:'새 위원회 / 보고 항목',lines:[]});
  markDirty(); render();
}
function removeSub(sKey, idx){
  state.meeting.sections[sKey].subs.splice(idx,1);
  markDirty(); render();
}

/* ============================= 렌더링 ============================= */
function tagLabel(tag){ return tag==='report' ? '보고' : tag==='motion' ? '동의안' : '구분'; }
function tagClass(tag){ return tag==='report' ? 'tag-report' : tag==='motion' ? 'tag-motion' : 'tag-none'; }

function renderLineRow(pathArr, line, idx){
  var pathAttr = JSON.stringify(pathArr);
  var lockedAttr = editMode ? '' : 'disabled';
  var html = '<div class="line">';
  html += '<span class="line-num">'+(idx+1)+'.</span>';
  html += '<textarea class="line-text" '+lockedAttr+' rows="1" data-autogrow="1" oninput="setField('+esc(pathAttr).replace(/"/g,'&quot;')+'.concat(['+idx+',\\'text\\']), this.value); autoGrow(this);" placeholder="내용을 입력하세요">'+esc(line.text)+'</textarea>';
  if(editMode){
    html += '<button class="tag-pill '+tagClass(line.tag)+'" onclick=\'cycleTag('+pathAttr+','+idx+')\'>'+tagLabel(line.tag)+'</button>';
  } else if(line.tag){
    html += '<span class="tag-pill '+tagClass(line.tag)+'">'+tagLabel(line.tag)+'</span>';
  }
  if(editMode){
    html += '<button class="tag-pill" style="background:'+(line.hasAttachment?'var(--gold-soft)':'transparent')+';border:1px dashed var(--edge);color:'+(line.hasAttachment?'#4a3a05':'var(--sub)')+'" onclick=\'toggleAttach('+pathAttr+','+idx+')\'>📎 첨부</button>';
  } else if(line.hasAttachment){
    html += '<button class="attach-chip" onclick=\'openAttachment('+pathAttr+','+idx+')\'>📎 첨부서류 참고</button>';
  }
  if(editMode){
    html += '<button class="line-del" onclick=\'removeLine('+pathAttr+','+idx+')\' title="삭제">✕</button>';
  }
  html += '</div>';
  if(editMode && line.hasAttachment){
    html += '<div style="margin:0 0 10px 24px;"><textarea placeholder="첨부 내용 메모 (예: 파일명, 요약, 링크)" style="width:100%;min-height:56px;border:1px solid var(--edge);border-radius:6px;padding:8px;font-family:\\'Noto Sans KR\\',sans-serif;font-size:12.5px;" oninput="setField('+esc(pathAttr).replace(/"/g,'&quot;')+'.concat(['+idx+',\\'attachmentContent\\']), this.value)">'+esc(line.attachmentContent)+'</textarea></div>';
  }
  return html;
}

function renderLinesBlock(pathArr, lines){
  var html='';
  lines.forEach(function(line,idx){ html += renderLineRow(pathArr, line, idx); });
  if(editMode){
    html += '<button class="addline-btn" onclick=\'addLine('+JSON.stringify(pathArr)+')\'>+ 항목 추가</button>';
  }
  if(!editMode && lines.length===0){
    html += '<div style="color:var(--sub);font-size:13px;">— 내용 없음 —</div>';
  }
  return html;
}

function tocRows(){
  var s = state.meeting.sections;
  var order=['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12'];
  var html='';
  order.forEach(function(k){
    var sec=s[k];
    html += '<div class="toc-row" onclick="gotoSection(\\''+k+'\\')"><span class="n">'+sec.num+'</span><span>'+esc(sec.title)+'</span></div>';
    if(sec.kind==='sub'){
      sec.subs.forEach(function(sub,i){
        html += '<div class="toc-subrow" onclick="event.stopPropagation();gotoSection(\\''+k+'\\',\\''+i+'\\')">'+esc(sub.key)+'. '+esc(sub.label)+'</div>';
      });
    }
  });
  return html;
}

function renderSectionTitle(k, sec){
  var lockedAttr = editMode?'':'disabled';
  if(editMode){
    return '<div class="sec-title"><span class="num">'+sec.num+'</span><input class="title-edit" '+lockedAttr+' value="'+esc(sec.title)+'" oninput="setField([\\'meeting\\',\\'sections\\',\\''+k+'\\',\\'title\\'], this.value)"></div>';
  }
  return '<div class="sec-title"><span class="num">'+sec.num+'</span><span>'+esc(sec.title)+'</span></div>';
}

function renderSection(k){
  var sec = state.meeting.sections[k];
  var html = '<div class="section-block" id="sec-'+k+'" data-anchor="'+k+'">';
  html += renderSectionTitle(k, sec);

  if(sec.kind==='static'){
    if(k==='s1'){
      html += '<div style="font-size:13px;color:var(--sub);">사회: '+esc(state.meeting.meetingChair||'—')+'</div>';
    } else if(k==='s12'){
      html += '<div style="font-size:13px;color:var(--sub);">제 '+esc(state.meeting.ordinal||'—')+'차 정기노회를 폐회합니다.</div>';
    }
  } else if(sec.kind==='lines'){
    html += renderLinesBlock(['meeting','sections',k,'lines'], sec.lines);
  } else if(sec.kind==='sub'){
    sec.subs.forEach(function(sub, i){
      var lockedAttr = editMode?'':'disabled';
      html += '<div class="sub-block" id="sec-'+k+'-sub-'+i+'" data-anchor="'+k+'-sub-'+i+'">';
      html += '<div class="sub-label">';
      if(editMode){
        html += '<input value="'+esc(sub.key+'. '+sub.label)+'" oninput="onSubLabelInput(this,\\''+k+'\\','+i+')">';
        html += '<button class="subdel" onclick="removeSub(\\''+k+'\\','+i+')">삭제</button>';
      } else {
        html += '<span>'+esc(sub.key)+'. '+esc(sub.label)+'</span>';
      }
      html += '</div>';
      html += renderLinesBlock(['meeting','sections',k,'subs',i,'lines'], sub.lines);
      html += '</div>';
    });
    if(editMode){

/* ============================= 네비게이션 (회순 이동 + 뒤로가기) ============================= */
function scrollToAnchor(anchor){
  var el;
  if(anchor==='cover') el=document.getElementById('page-cover');
  else if(anchor==='header') el=document.getElementById('page-header');
  else if(anchor.indexOf('-sub-')>-1) el=document.getElementById('sec-'+anchor);
  else el=document.getElementById('sec-'+anchor);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function gotoSection(k, subIdx){
  var target = subIdx!==undefined ? (k+'-sub-'+subIdx) : k;
  if(currentAnchor && currentAnchor!==target){ navStack.push(currentAnchor); }
  document.getElementById('backBtn').disabled = navStack.length===0;
  scrollToAnchor(target);
  setActiveToc(target);
  closeTocPanelMobile();
}
function goBack(){
  if(!navStack.length) return;
  var prev = navStack.pop();
  document.getElementById('backBtn').disabled = navStack.length===0;
  scrollToAnchor(prev);
  setActiveToc(prev);
}
function setActiveToc(anchor){ currentAnchor = anchor; }

function setupObserver(){
  if(io) io.disconnect();
  var blocks = document.querySelectorAll('[data-anchor]');
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ currentAnchor = e.target.getAttribute('data-anchor'); }
    });
  }, {root:document.getElementById('docPanel'), threshold:0.2, rootMargin:'-40% 0px -50% 0px'});
  blocks.forEach(function(b){ io.observe(b); });
}

/* ============================= 저장 / 보관함 (Google Apps Script 백엔드) ============================= */
function isConfigured(){
  if(APPS_SCRIPT_URL.indexOf('여기에_배포된')>-1){
    alert('먼저 코드 상단의 APPS_SCRIPT_URL 값을 배포한 Apps Script 웹앱 주소로 바꿔주세요.\n(전달된 배포 안내를 참고하세요)');
    return false;
  }
  return true;
}

/* GET 요청: Apps Script 응답을 <script> 태그로 불러오는 JSONP 방식 (CORS 우회) */
function jsonp(params){
  return new Promise(function(resolve, reject){
    var cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    var script = document.createElement('script');
    var timer = setTimeout(function(){
      cleanup(); reject(new Error('요청 시간 초과'));
    }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function(data){ cleanup(); resolve(data); };
    var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    script.src = APPS_SCRIPT_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function(){ cleanup(); reject(new Error('네트워크 오류')); };
    document.body.appendChild(script);
  });
}

/* POST 요청(저장/삭제): Apps Script는 CORS 프리플라이트를 허용하지 않으므로
   no-cors + text/plain으로 전송합니다. 응답 본문은 읽을 수 없어(불투명 응답) 성공 여부를
   별도로 확인하지 않고, 곧바로 목록을 새로고침해 반영 여부를 눈으로 확인합니다. */
async function postToScript(body){
  await fetch(APPS_SCRIPT_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
}

async function saveMeeting(){
  var m = state.meeting;
  if(!m.ordinal){ alert('회차(제 몇 차)를 먼저 입력해주세요.'); return; }
  if(!isConfigured()) return;
  m.id = String(m.ordinal);
  var badge = document.getElementById('saveBadge');
  badge.textContent='저장 중…'; badge.style.color='#B9C2D6';
  try{
    await postToScript({action:'save', meeting:m});
    markClean();
  }catch(err){
    console.error(err);
    alert('저장 중 오류가 발생했습니다. 네트워크 설정에서 script.google.com 접속이 허용되어 있는지 확인해주세요.');
  }
}

function newMeeting(){
  if(dirty && !confirm('저장하지 않은 변경사항이 있습니다. 새 회의를 시작할까요?')) return;
  var prevChair = state.meeting.meetingChair;
  var m = blankMeeting();
  // 다음 회차 번호 자동 추정 + 직전 담당자는 비워두고 시작 (담당자는 매번 바뀌므로)
  var n = parseFloat(state.meeting.ordinal);
  if(!isNaN(n)) m.ordinal = String(n+1);
  state.meeting = m;
  navStack=[]; currentAnchor='cover';
  editMode = true;
  markDirty();
  render();
  closeArchive();
}

/* ---------- 보관함 패널 ---------- */
var archiveIndexCache = [];
async function openArchive(){
  document.getElementById('archiveOverlay').classList.remove('hidden');
  await refreshArchiveIndex();
}
function closeArchive(){ document.getElementById('archiveOverlay').classList.add('hidden'); }
document.getElementById('archiveOverlay').addEventListener('click', function(e){ if(e.target.id==='archiveOverlay') closeArchive(); });

async function refreshArchiveIndex(){
  var list = document.getElementById('archiveList');
  list.innerHTML = '<div class="archive-empty">불러오는 중…</div>';
  if(!isConfigured()){ list.innerHTML = '<div class="archive-empty">먼저 배포 URL을 설정해주세요.</div>'; return; }
  try{
    var res = await jsonp({action:'list'});
    archiveIndexCache = (res && res.ok) ? res.items : [];
  }catch(e){
    archiveIndexCache = [];
    list.innerHTML = '<div class="archive-empty">불러오기 실패.<br>네트워크 또는 배포 URL을 확인해주세요.</div>';
    return;
  }
  renderArchiveList();
}

/* 날짜/회차/장소는 목록에서 바로 빠르게 필터링(서버 왕복 없이) */
function renderArchiveList(){
  var q = (document.getElementById('archiveSearch').value||'').trim().toLowerCase();
  var list = document.getElementById('archiveList');
  var items = archiveIndexCache.filter(function(x){
    if(!q) return true;
    var hay = [x.id,x.ordinal,x.dateDisplay,x.dateISO,x.hostChurchKo].join(' ').toLowerCase();
    return hay.indexOf(q)>-1;
  });
  if(items.length===0){ list.innerHTML='<div class="archive-empty">저장된 회의안이 없습니다.<br>먼저 "저장"을 눌러 보관해보세요.</div>'; return; }
  list.innerHTML = items.map(function(x){
    return '<div class="archive-item" onclick="loadMeeting(\\''+x.id+'\\')"><div class="t">제 '+esc(x.ordinal)+' 차 정기노회</div><div class="d">'+esc(x.dateDisplay||'')+' · '+esc(x.hostChurchKo||'')+'</div></div>';
  }).join('');
}

/* 회의 본문 내용(보고/동의안 텍스트)까지 서버에서 검색 */
async function doContentSearch(){
  var q = (document.getElementById('archiveSearch').value||'').trim();
  if(!q){ refreshArchiveIndex(); return; }
  if(!isConfigured()) return;
  document.getElementById('archiveList').innerHTML = '<div class="archive-empty">내용 검색 중…</div>';
  try{
    var res = await jsonp({action:'search', q:q});
    archiveIndexCache = (res && res.ok) ? res.items : [];
    renderArchiveList();
  }catch(e){
    document.getElementById('archiveList').innerHTML = '<div class="archive-empty">검색 실패</div>';
  }
}

async function loadMeeting(id){
  if(!isConfigured()) return;
  try{
    var res = await jsonp({action:'get', id:id});
    if(!res || !res.ok || !res.meeting){ alert('불러오기에 실패했습니다.'); return; }
    state.meeting = res.meeting;
    navStack=[]; currentAnchor='cover';
    markClean();
    render();
    closeArchive();
    window.scrollTo(0,0);
  }catch(e){ alert('불러오기 중 오류가 발생했습니다.'); }
}

/* ============================= 초기화 ============================= */
render();
markDirty(); // 처음엔 아직 보관함에 저장되지 않은 예시 데이터 상태
